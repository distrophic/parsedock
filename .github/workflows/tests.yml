name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libnss3 libxcomposite1 libxrandr2 libxi6 libxtst6 libxfixes3 libxdamage1
      - name: Install
        run: python -m pip install -U pip
      - name: Install ParseDock
        run: python -m pip install -e ".[dev,desktop,curl]"
      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          python -m pytest > pytest-report.txt 2>&1
          status=$?
          cat pytest-report.txt
          summary=$(grep -E "^=+ .* in " pytest-report.txt | tail -n 1)
          if printf '%s\n' "$summary" | grep -Eq "failed|error"; then
            exit 1
          fi
          if printf '%s\n' "$summary" | grep -q "passed"; then
            exit 0
          fi
          exit "$status"
