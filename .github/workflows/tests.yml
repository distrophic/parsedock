name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -U pip
      - name: Install ParseDock
        run: python -m pip install -e ".[dev,desktop,curl]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
